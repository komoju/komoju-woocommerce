name: lint

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
      - name: Setup dependencies
        run: |
          which php
          which composer
          php -i
          composer
          composer install
      - name: Run lint
        run: ./vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist --dry-run

  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
      - name: Run PHP tests
        run: |
          shopt -s nullglob
          tests=(tests/php/*-test.php)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No PHP tests found in tests/php/"
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "== $test"
            php "$test" || exit 1
          done
